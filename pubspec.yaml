name: flutter_doing
description: "A desktop/mac application for organizing to dos"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  json_annotation: 4.12.0
  flutter_riverpod: 2.6.1
  window_manager: 0.5.2
  desktop_multi_window: 0.3.1
  tray_manager: 0.5.3
  get_it: 9.2.1
  intl: any
  flutter_localizations:
    sdk: flutter
  shared_preferences: 2.5.5
  path_provider: 2.1.6
  launch_at_startup: 0.0.1
  package_info_plus: 10.2.1
  flutter_desktop_notifications: 1.1.2
  html: 0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
